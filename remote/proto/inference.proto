// Remote GPU worker protocol for LiveTalking (Option B).
//
// The host keeps running the full Flask/aiohttp server (TTS, ASR feature
// extraction, paste-back, streaming). Only the heavy GPU stages move to a
// remote Linux/NVIDIA box:
//   * avatar inference  (MuseTalk UNet+VAE, Wav2Lip convnet)  -> InferBatch
//   * base-video enhance (RVM matting + Real-ESRGAN + GFPGAN)  -> EnhanceVideo
//
// Tensors travel as (dtype, shape, raw little-endian bytes) so no pickle is
// on the wire. Frames come back as a single stacked tensor per batch.

syntax = "proto3";

package livetalking.remote;

service RemoteWorker {
  // Liveness + which backend/avatar is currently resident.
  rpc Health(Empty) returns (HealthReply);

  // Load the heavy model weights for a backend on the worker GPU.
  // backend: "musetalk" | "wav2lip"
  rpc LoadModel(ModelSpec) returns (OpReply);

  // Ship an avatar's inference artifacts (latents for musetalk, face crops
  // for wav2lip) to the worker and make it resident. Idempotent per avatar_id.
  rpc LoadAvatar(AvatarPayload) returns (OpReply);

  // One inference batch. audiofeat is the per-frame audio feature list the
  // host's ASR worker already produced; the worker returns the model's raw
  // prediction frames (the host does paste_back locally).
  rpc InferBatch(InferRequest) returns (InferReply);

  // Drop resident avatar/model state (frees VRAM).
  rpc Unload(Empty) returns (OpReply);

  // Run the whole base-video enhance pipeline on the worker and return a zip
  // with enhanced.mp4 + optional matte/ + person/ sidecars.
  rpc EnhanceVideo(EnhanceRequest) returns (EnhanceReply);

  // Build an avatar from a source clip ON THE WORKER'S GPU and return the
  // artifacts as a zip. This is the creation counterpart of InferBatch: the
  // host keeps the source clip and the finished artifact, the box does the
  // heavy per-frame VAE/parse work. The zip layout mirrors what
  // avatars/<backend>/genavatar.py writes into data/avatars/<id>/.
  rpc GenerateAvatar(GenerateAvatarRequest) returns (GenerateAvatarReply);
}

message Empty {}

message Tensor {
  string dtype = 1;              // "uint8" | "float32" | "float16"
  repeated int64 shape = 2;
  bytes data = 3;                // raw bytes, C-order
}

message OpReply {
  bool ok = 1;
  string msg = 2;
}

message HealthReply {
  bool ok = 1;
  string device = 2;            // e.g. "cuda"
  string backend = 3;           // resident backend, "" if none
  string avatar_id = 4;         // resident avatar, "" if none
  string detail = 5;            // GPU name
  // Code revision the worker is running (LT_REVISION env, .deploy/revision
  // file, or `git rev-parse --short HEAD`). Lets a deploy assert that the box
  // runs the revision you just pushed instead of guessing.
  string revision = 6;
  // True while a GPU call (infer/enhance/model load) is in flight. A deploy
  // uses it to refuse a restart that would kill a live session mid-batch.
  bool busy = 7;
  // Wire features this worker understands, so the host can pick the cheapest
  // one instead of guessing from a version string. Currently:
  //   "feat-block"  InferRequest.feat_block/feat_offsets/feat_rows_per_frame
  //   "jpeg-bgr"    JPEG-compressed reply frames
  // An EMPTY list means a worker older than this field: the host must fall back
  // to per-frame `audiofeat` tensors and raw replies.
  repeated string capabilities = 8;
}

message ModelSpec {
  string backend = 1;           // "musetalk" | "wav2lip"
}

message AvatarPayload {
  string backend = 1;
  string avatar_id = 2;
  // One tensor per frame. musetalk: latents [1,8,32,32]; wav2lip: face crops
  // [H,W,3] uint8. Ordering matches the local artifact order.
  repeated Tensor frames = 3;
}

message InferReply {
  Tensor frames = 1;            // stacked pred frames [B,H,W,3]
  // Optional JPEG-compressed form of `frames`, one image per batch element,
  // colour order preserved (BGR, as cv2 writes it). When `encoding` is
  // "jpeg-bgr" the host MUST decode these instead of reading `frames`.
  //
  // Why: raw pred crops are ~192 KB/frame at 256x256, so a batch of 8 is
  // 1.57 MB. Over a ~1 MB/s SSH link that is ~2 s per batch — the transport,
  // not the GPU (~40 ms), is the bottleneck. JPEG q90 shrinks the same batch
  // to ~63 KB (25x) with a mean channel error of ~1.3/255, which is invisible
  // after paste_back + VP8 encode.
  repeated bytes jpeg = 2;
  string encoding = 3;          // "" (raw, use `frames`) | "jpeg-bgr"
}

message InferRequest {
  int64 index = 1;              // absolute frame index (mirror_index applied worker-side)
  int32 batch_size = 2;
  // One tensor per batch element: the audio feature chunk. musetalk: [50,384]
  // uint8; wav2lip: [1,80,16] float32.
  //
  // LEGACY form. Still honoured (and still what an older host sends), but the
  // block form below supersedes it: consecutive frames of one batch read
  // OVERLAPPING rows of the SAME whisper feature array, so sending one tensor
  // per frame re-transmits those shared rows n times.
  repeated Tensor audiofeat = 3;
  // Preferred reply encoding. "jpeg-bgr" asks the worker to send `jpeg`
  // instead of raw `frames`; empty asks for raw (used by local debugging).
  // The worker falls back to raw if it cannot encode.
  string want_encoding = 4;
  // JPEG quality for "jpeg-bgr". 0 means the worker default (90).
  int32 jpeg_quality = 5;
  // ── Block form of the audio features (preferred; see capabilities) ──────
  // The batch's feature rows as ONE tensor [N, H, 384], where N is the span of
  // rows touched by any frame in the batch. `feat_offsets[i]` is frame i's
  // start row INSIDE this block, and `feat_rows_per_frame` is how many rows
  // one frame consumes. The worker rebuilds frame i as
  //
  //   block[off : off + rows].reshape(-1, 384)
  //
  // which is byte-identical to what `audiofeat[i]` carried: both are slices of
  // the one whisper array, computed with the same clamp-free window arithmetic.
  //
  // A musetalk batch of 8 needs 24 rows (3.33x less) instead of 8 x 10 rows.
  // The offsets are explicit rather than derived so the worker never has to
  // know the host's window/stride math, and so a future backend with a
  // different overlap pattern needs no proto change.
  Tensor feat_block = 6;
  repeated int32 feat_offsets = 7;
  int32 feat_rows_per_frame = 8;
}

message EnhanceRequest {
  string filename = 1;          // source clip name (ext preserved)
  bytes source = 2;             // raw source video bytes
  int32 width = 3;
  int32 height = 4;
  string background = 5;        // "#RRGGBB" / "r,g,b"
  string fit = 6;               // "contain" | "cover"
  float strength = 7;           // 0..1
  bool face_restore = 8;
  int32 upscale = 9;            // 1 | 2 | 4
  int32 max_frames = 10;        // 0 = all
  bool want_matte = 11;         // include matte/ sidecar in the zip
  bool want_person = 12;        // include person/ sidecar in the zip
}

message EnhanceReply {
  bool ok = 1;
  string msg = 2;
  bytes archive = 3;            // zip: enhanced.mp4, [matte/], [person/], meta.json
  int32 frames = 4;
  double fps = 5;
}

message GenerateAvatarRequest {
  string backend = 1;           // "musetalk" | "wav2lip"
  string avatar_id = 2;
  // The source clip. Either raw bytes (the host uploads a browser upload) or a
  // path that already exists inside the worker's shared data dir.
  bytes source = 3;
  string filename = 4;          // source clip name (extension preserved)
  string source_path = 5;       // alternative to `source`; ignored when bytes set
  // Backend parameters, already validated on the host against
  // AVATAR_GENERATORS. Encoded as JSON so adding a knob does not need a proto
  // change on both sides.
  string params_json = 6;
}

message GenerateAvatarReply {
  bool ok = 1;
  string msg = 2;
  // zip: the exact tree genavatar wrote, relative to data/avatars/<avatar_id>/.
  bytes archive = 3;
  int32 frames = 4;
  // Set when the artifact was written directly into a shared data dir (the
  // worker and host share data/avatars via the install-root symlink), so no
  // transfer is needed.
  bool written_locally = 5;
  string artifact_path = 6;
}
