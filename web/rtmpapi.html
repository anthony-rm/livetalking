<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>LiveTalking - RTMP</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
	<link rel="stylesheet" href="/theme.css">
	<script type="text/javascript" src="mpegts-1.7.3.min.js"></script>
	<script type="text/javascript" src="https://code.jquery.com/jquery-2.1.1.min.js"></script>
</head>

<body>

<nav class="navbar navbar-dark navbar-themed">
	<div class="container-fluid px-4">
		<a class="navbar-brand" href="/index.html"><i class="bi bi-camera-video-fill me-2"></i>LiveTalking</a>
		<span class="text-white-50 small d-none d-md-inline">RTMP / HTTP-FLV playback &amp; echo driver</span>
	</div>
</nav>

<div class="container mt-4">
	<div class="row g-4">
		<div class="col-lg-7">
			<div class="glass-card">
				<div class="card-header"><i class="bi bi-broadcast"></i> Live Stream</div>
				<div class="card-body">
					<video id="video_player" class="w-100" controls autoplay muted></video>
				</div>
			</div>
		</div>

		<div class="col-lg-5">
			<div class="glass-card">
				<div class="card-header"><i class="bi bi-chat-text-fill"></i> Echo Driver (POST /human)</div>
				<div class="card-body">
					<form id="echo-form">
						<label class="form-label">Input text</label>
						<textarea class="form-control form-control-sm mb-3" rows="3" id="message">test</textarea>
						<button type="submit" class="btn-primary-custom"><i class="bi bi-send"></i> Send</button>
					</form>
					<div id="log" class="mt-3"></div>
				</div>
			</div>
		</div>
	</div>
</div>

<script type="text/javascript" charset="utf-8">
	$(document).ready(function () {
		var host = window.location.hostname

		flvPlayer = mpegts.createPlayer({ type: 'flv', url: "http://" + host + ":8080/live/livestream.flv", isLive: true, enableStashBuffer: false });
		flvPlayer.attachMediaElement(document.getElementById('video_player'));
		flvPlayer.load();
		flvPlayer.play();

		$('#echo-form').on('submit', function (e) {
			e.preventDefault();
			var message = $('#message').val();
			console.log('Sending: ' + message);
			fetch('/human', {
				body: JSON.stringify({
					text: message,
					type: 'echo',
					sessionid: '0',
				}),
				headers: {
					'Content-Type': 'application/json'
				},
				method: 'POST'
			});
			$('#message').val('');
		});
	});
</script>

</body>
</html>
