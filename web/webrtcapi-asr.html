<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LiveTalking - WebRTC (Echo + ASR)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/theme.css">
    <style>
        .asr-frame { width: 100%; height: 620px; border: 0; border-radius: 8px; background: #fff; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark navbar-themed">
    <div class="container-fluid px-4">
        <a class="navbar-brand" href="/index.html"><i class="bi bi-camera-video-fill me-2"></i>LiveTalking</a>
        <span class="text-white-50 small d-none d-md-inline">WebRTC playback, echo driver, recording and ASR</span>
    </div>
</nav>

<div class="container mt-4">
    <div class="row g-4">
        <div class="col-lg-7">
            <div class="glass-card">
                <div class="card-header">
                    <i class="bi bi-broadcast"></i> Media
                    <div class="d-flex gap-2 ms-auto">
                        <button class="btn-primary-custom btn-sm" id="start" onclick="start()"><i class="bi bi-play-fill"></i> Start</button>
                        <button class="btn-danger-custom btn-sm" id="stop" style="display: none" onclick="stop()"><i class="bi bi-stop-fill"></i> Stop</button>
                    </div>
                </div>
                <div class="card-body">
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" id="use-stun"/>
                        <label class="form-check-label small" for="use-stun">Use STUN server</label>
                    </div>
                    <audio id="audio" autoplay="true"></audio>
                    <video id="video" class="w-100" autoplay="true" playsinline="true"></video>
                    <input type="hidden" id="sessionid" value="0">
                </div>
            </div>

            <div class="glass-card">
                <div class="card-header"><i class="bi bi-record-circle"></i> Recording (POST /record)</div>
                <div class="card-body">
                    <div class="d-flex gap-2">
                        <button class="btn-primary-custom btn-sm" id="btn_start_record"><i class="bi bi-record-circle"></i> Start Recording</button>
                        <button class="btn-outline-custom btn-sm" id="btn_stop_record" disabled><i class="bi bi-stop-circle"></i> Stop Recording</button>
                    </div>
                </div>
            </div>

            <div class="glass-card">
                <div class="card-header"><i class="bi bi-chat-text-fill"></i> Echo Driver (POST /human)</div>
                <div class="card-body">
                    <form class="form-inline" id="echo-form">
                        <label class="form-label">Input text</label>
                        <textarea cols="2" rows="3" class="form-control form-control-sm mb-3" id="message">test</textarea>
                        <button type="submit" class="btn-primary-custom"><i class="bi bi-send"></i> Send</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-5">
            <div class="glass-card">
                <div class="card-header"><i class="bi bi-mic-fill"></i> Speech Recognition</div>
                <div class="card-body p-2">
                    <iframe class="asr-frame" src="asr/index.html" title="Speech recognition"></iframe>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="client.js"></script>
<script type="text/javascript" src="https://code.jquery.com/jquery-2.1.1.min.js"></script>
<script type="text/javascript" charset="utf-8">
	$(document).ready(function() {

	  $('#echo-form').on('submit', function(e) {
      e.preventDefault();
      var message = $('#message').val();
      console.log('Sending: ' + message);
      fetch('/human', {
            body: JSON.stringify({
                text: message,
                type: 'echo',
                interrupt: true,
                sessionid: String(document.getElementById('sessionid').value),
            }),
            headers: {
                'Content-Type': 'application/json'
            },
            method: 'POST'
      });
      $('#message').val('');
	  });

    $('#btn_start_record').click(function() {
        console.log('Starting recording...');
        fetch('/record', {
            body: JSON.stringify({
                    type: 'start_record',
                }),
                headers: {
                    'Content-Type': 'application/json'
                },
            method: 'POST'
        }).then(function(response) {
            if (response.ok) {
                console.log('Recording started.');
                $('#btn_start_record').prop('disabled', true);
                $('#btn_stop_record').prop('disabled', false);
            } else {
                console.error('Failed to start recording.');
            }
        }).catch(function(error) {
            console.error('Error:', error);
        });
    });

    $('#btn_stop_record').click(function() {
        console.log('Stopping recording...');
        fetch('/record', {
            body: JSON.stringify({
                    type: 'end_record',
                }),
                headers: {
                    'Content-Type': 'application/json'
                },
            method: 'POST'
        }).then(function(response) {
            if (response.ok) {
                console.log('Recording stopped.');
                $('#btn_start_record').prop('disabled', false);
                $('#btn_stop_record').prop('disabled', true);
            } else {
                console.error('Failed to stop recording.');
            }
        }).catch(function(error) {
            console.error('Error:', error);
        });
    });

	});
</script>
</body>
</html>
