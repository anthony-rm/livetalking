<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LiveTalking - WebRTC Push (Echo)</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/theme.css">
</head>

<body>

<nav class="navbar navbar-dark navbar-themed">
  <div class="container-fluid px-4">
    <a class="navbar-brand" href="/index.html"><i class="bi bi-camera-video-fill me-2"></i>LiveTalking</a>
    <span class="text-white-50 small d-none d-md-inline">WebRTC (WHEP) playback &amp; echo driver</span>
  </div>
</nav>

<div class="container mt-4">
  <div class="row g-4">
    <div class="col-lg-7">
      <div class="glass-card">
        <div class="card-header">
          <i class="bi bi-broadcast"></i> Media
          <button class="btn-primary-custom btn-sm ms-auto" id="btn_play"><i class="bi bi-play-fill"></i> Start</button>
        </div>
        <div class="card-body">
          <div class="form-check form-switch mb-3">
            <input class="form-check-input" type="checkbox" id="use-stun" />
            <label class="form-check-label small" for="use-stun">Use STUN server</label>
          </div>
          <video id="rtc_media_player" class="w-100" controls autoplay></video>
        </div>
      </div>
    </div>

    <div class="col-lg-5">
      <div class="glass-card">
        <div class="card-header"><i class="bi bi-chat-text-fill"></i> Echo Driver (POST /human)</div>
        <div class="card-body">
          <form id="echo-form">
            <label class="form-label">Input text</label>
            <textarea class="form-control form-control-sm mb-3" rows="3" id="message">test</textarea>
            <button type="submit" class="btn-primary-custom"><i class="bi bi-send"></i> Send</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="srs.sdk.js"></script>
<script type="text/javascript" src="https://code.jquery.com/jquery-2.1.1.min.js"></script>
<script type="text/javascript" charset="utf-8">

  $(document).ready(function () {
    $('#echo-form').on('submit', function (e) {
      e.preventDefault();
      var message = $('#message').val();
      console.log('Sending: ' + message);
      fetch('/human', {
        body: JSON.stringify({
          text: message,
          type: 'echo',
          sessionid: '0',
        }),
        headers: {
          'Content-Type': 'application/json'
        },
        method: 'POST'
      });
      $('#message').val('');
    });
  });

  $(function () {
    var sdk = null; // Global handler to do cleanup when republishing.
    var startPlay = function () {
      $('#rtc_media_player').show();

      // Close PC when user replay.
      if (sdk) {
        sdk.close();
      }
      sdk = new SrsRtcWhipWhepAsync();

      $('#rtc_media_player').prop('srcObject', sdk.stream);

      var host = window.location.hostname
      // For example: webrtc://r.ossrs.net/live/livestream
      var url = "http://" + host + ":1985/rtc/v1/whep/?app=live&stream=livestream"
      sdk.play(url).then(function (session) {
        // WHEP session established
      }).catch(function (reason) {
        sdk.close();
        $('#rtc_media_player').hide();
        console.error(reason);
      });
    };

    $('#rtc_media_player').hide();
    $("#btn_play").click(startPlay);
  });
</script>

</body>
</html>
