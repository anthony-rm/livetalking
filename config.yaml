###############################################################################
#  LiveTalking Configuration
#  CLI arguments override values in this file
###############################################################################

# -------- Audio ----------------------------------------------------------
l: 10
m: 8
r: 10

# -------- Avatar Model ----------------------------------------------------------
# GPU work (avatar inference + enhance) runs in this process, on this machine.
# There is no remote worker any more: the app is installed on the GPU box and a
# browser reaches it over an SSH tunnel (`ssh -L 8010:127.0.0.1:8010`).
# `model` is the default backend; the avatar's own artifacts still decide which
# backend actually loads.
model: musetalk
avatar_id: anthony007
# benchmark_batchsize.py (M2 Air, fp16): bs8=22.5fps  bs16=17.7fps  bs32=14.0fps
batch_size: 8

# -------- Custom Actions ----------------------------------------------------------
customvideo_config: ''

# -------- TTS ----------------------------------------------------------
tts: edgetts                   # edgetts / gpt-sovits / cosyvoice / fishtts / tencent / doubao / indextts2 / azuretts / qwentts
REF_FILE: ''                   # voice name or reference audio file path (wav, 16kHz, mono)
REF_TEXT: ''                   # reference text for voice cloning (English or Chinese)
TTS_SERVER: ''                 # TTS server URL, no trailing slash

# -------- LLM ----------------------------------------------------------
llm_provider: dashscope        # dashscope / orcarouter
llm_model: ''                  # model override, empty = provider default (qwen-plus / orcarouter/auto)

# -------- Transport ----------------------------------------------------------
transport: webrtc              # rtcpush / webrtc / rtmp / virtualcam
video_codec: vp8               # vp8 / h264 / h264,vp8 / vp8,h264
                              # VP8 is the safe default: H.264 requires
                              # sprop-parameter-sets in the SDP, which aiortc
                              # does not emit — Firefox then shows a black video.
stun: 'stun:stun.freeswitch.org:3478'  # stun server URL
push_url: ''                   # push URL for rtcpush/rtmp (not needed for webrtc/virtualcam)
max_session: 1                 # max concurrent sessions (1 for Ditto: ~1GB host RAM per session)
listenport: 8010
